# Local satpy composites (loaded via SATPY_CONFIG_PATH, see satpy_frame.py).
sensor_name: visir/abi

composites:
  # Night side: C13 (10.3 um) brightness temperature as grey RGB
  # (inverted in enhancements/abi.yaml: cold cloud tops bright, warm surface dark).
  night_ir_gray:
    compositor: !!python/name:satpy.composites.core.GenericCompositor
    standard_name: night_ir_gray
    prerequisites:
      - 10.3
      - 10.3
      - 10.3

  # Like satpy's true_color_with_night_ir, but without the Black Marble
  # city-lights background (its download currently fails satpy's hash check).
  true_color_with_night_ir_nobg:
    compositor: !!python/name:satpy.composites.fill.DayNightCompositor
    standard_name: true_color_with_night_ir
    lim_low: 80
    lim_high: 90
    prerequisites:
      - true_color
      - night_ir_gray

  # Soft terminator: satpy's corrected true_color on the lit disk, cross-faded
  # (linear in cos(sun zenith) between lim_low and lim_high) into the
  # uncorrected true_color_nocorr, which falls off naturally to a dark night side.
  # Avoids true_color's hard terminator edge and saturated twilight crescent.
  true_color_soft:
    compositor: !!python/name:satpy.composites.fill.DayNightCompositor
    standard_name: true_color_with_night_ir
    lim_low: 70
    lim_high: 90
    prerequisites:
      - true_color
      - true_color_nocorr

  true_color_soft_wide:
    compositor: !!python/name:satpy.composites.fill.DayNightCompositor
    standard_name: true_color_with_night_ir
    lim_low: 50
    lim_high: 90
    prerequisites:
      - true_color
      - true_color_nocorr
